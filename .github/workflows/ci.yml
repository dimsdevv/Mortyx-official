name: Mortyx CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality & Automated Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, pdo_sqlite

      - name: Validate PHP Syntax (Linting)
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

      - name: Run Catalog & Layout Unit Tests
        run: |
          php tests/test_runner.php

      - name: Run Relational Database & Transaction Tests
        run: |
          php tests/test_database.php
